# Sample: cmux monitoring workspace (solar-harness)
# Usage:
#   render-cmux-workspace config/cmux-workspace-sample.yaml
#   cmux-monitor-up config/cmux-workspace-sample.yaml
#   cmux-monitor-doctor config/cmux-workspace-sample.yaml
#   cmux-monitor-down config/cmux-workspace-sample.yaml

workspace_name: "solar-runtime"

ssh_profiles:
  mini:
    host: "mini"
    user: "lisihao"
    control_master: true

tabs:
  # Primary human UI: status cards, not raw terminal mirroring. This keeps CMUX
  # readable even when the source tmux panes are narrow or visually noisy.
  - id: "solar-status-cards"
    title: "Solar Status Cards"
    layout: "single"
    panes:
      - title: "solar-status-cards"
        source: "local"
        mode: "status-card"
        tmux_targets:
          - "solar-harness:0.0"
          - "solar-harness:0.1"
          - "solar-harness:0.2"
          - "solar-harness:0.3"
          - "solar-harness-lab:0.0"
          - "solar-harness-lab:0.1"
          - "solar-harness-lab:0.2"
          - "solar-harness-lab:0.3"
        interval_sec: 3
        tail_lines: 14

  # Human-friendly focus tabs: one source pane per cmux workspace, with joined
  # wrapped lines so text is not trapped in the source tmux pane width.
  - id: "solar-builder-focus"
    title: "Solar Builder Focus"
    layout: "single"
    panes:
      - title: "solar-harness-builder"
        source: "local"
        tmux_target: "solar-harness:0.2"
        mode: "capture"
        lines: 160
        interval_sec: 3

  - id: "solar-evaluator-focus"
    title: "Solar Evaluator Focus"
    layout: "single"
    panes:
      - title: "solar-harness-evaluator"
        source: "local"
        tmux_target: "solar-harness:0.3"
        mode: "capture"
        lines: 160
        interval_sec: 3

  - id: "solar-lab-focus"
    title: "Solar Lab Focus"
    layout: "single"
    panes:
      - title: "solar-harness-lab-active"
        source: "local"
        tmux_target: "solar-harness-lab:0.3"
        mode: "capture"
        lines: 160
        interval_sec: 3

  # Overview fallback for machine-readable/passive pane monitoring.
  - id: "solar-capture-fallback"
    title: "Solar Capture Fallback"
    layout: "quad"
    panes:
      - title: "pm"
        source: "local"
        tmux_target: "solar-harness:0.0"
        mode: "capture"
        lines: 80
        interval_sec: 3
      - title: "planner"
        source: "local"
        tmux_target: "solar-harness:0.1"
        mode: "capture"
        lines: 80
        interval_sec: 3
      - title: "builder"
        source: "local"
        tmux_target: "solar-harness:0.2"
        mode: "capture"
        lines: 80
        interval_sec: 3
      - title: "evaluator"
        source: "local"
        tmux_target: "solar-harness:0.3"
        mode: "capture"
        lines: 80
        interval_sec: 3

  # Tab 4: remote mini (capture) — enable when remote is available

capsule_id: capsule.browser.webwright-long-horizon-task
version: 0.1.0
capsule_kind: browser_long_horizon
name: Webwright Long-Horizon Browser Task Capsule
logical_operator_bindings:
  BrowseAndAct:
    logical_operator: WebwrightPlaywright
    physical_operator: op.browser.webwright.playwright.01
    preconfigured: true
  WebResearchInteractive:
    logical_operator: WebwrightPlaywright
    physical_operator: op.browser.webwright.playwright.01
    preconfigured: true
  FillFormWorkflow:
    logical_operator: WebwrightPlaywright
    physical_operator: op.browser.webwright.playwright.01
    preconfigured: true
  ExtractRenderedData:
    logical_operator: WebwrightPlaywright
    physical_operator: op.browser.webwright.playwright.01
    preconfigured: true
  BuildReusableWebTool:
    logical_operator: WebwrightPlaywright
    physical_operator: op.browser.webwright.playwright.01
    preconfigured: true
preconditions:
  - check: start_url_present
    required: true
  - check: task_present
    required: true
  - check: dispatch_id_present
    required: true
  - check: output_directory_writable
postconditions:
  - check: file_exists
    path: final_script.py
  - check: file_exists
    path: trajectory.json
  - check: dir_not_empty
    path: screenshots
    must_have_min_files: 1
  - check: file_exists
    path: report.json
negative_effects:
  - can_create_local_artifacts
  - can_request_allowlisted_network_targets
  - can_update_dispatch_workdir_state

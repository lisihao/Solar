# Solar Harness 能力供给账本 (P1 CapabilityRegistry, 2026-06-11)
#
# 病根 R2: capability enrichment 自动产需求 (175 种), 算子池供给登记空白
# → 匹配率 0%, 2193 节点-需求对全堵。本账本是供给侧的唯一事实源。
#
# 三层供给 (来源必须可追溯, 禁止造假账):
#   platform  — harness 系统自身提供, 任何跑在 harness 里的算子天然具备。
#               evidence = capability certification 实测报告。
#   role      — 按算子角色推定 (代码 agent 天然具备的方法论能力)。
#               evidence = role_inference (显式标注非实测)。
#   operator  — 特化能力, per-operator 登记 (browser/evaluation 等)。
#               逐步用 certification/真实任务证据补。
#
# registry 词表 = platform ∪ role ∪ operator ∪ aliases。
# 词表外的需求 = enrichment 幻觉 (如要求未建成的 meta_harness.*) → drop + warn 事件。

version: 1
updated_at: "2026-06-11"

platform:
  # 46% 需求 (982/2106 节点-需求对)。harness 运行时即供给。
  evidence: "capability_certification_suite fast 实测 (reports/capability-certification/)"
  capabilities:
    - harness.context_preflight
    - harness.status
    - harness.dag
    - harness.contracts
    - harness.dispatch_visibility
    - harness.model_routing
    - harness.intent
    - dag.validate
    - dag.ready_nodes
    - dag.join_gate
    - intent.match
    - intent.audit
    - dispatch.intent_telemetry
    - routing.complexity_budget
    - agent.inventory
    - command.catalog
    - rules.catalog
    - mcp.catalog
    - skill.inject
    - capability.scorecard
    - workflow.guard
    - status.projection
    - contracts.library
    # 2026-06-11 第二轮补录 (audit top_uncovered 中平台真有的, README 功能表均 ok):
    - document.convert          # MarkItDown 集成
    - document.markdown_extract # MarkItDown 集成
    - mcp.markitdown            # MarkItDown MCP
    - persona.agent             # personas/ + operatord persona 注入
    - agent.catalog             # agents 清单 (同 agent.inventory)
    - specialist.routing        # model_registry + 角色路由
    - models.show               # 模型注册表查询
    - models.lab_matrix         # lab 模型矩阵 (farm-layout)
    - models.footer_labels      # quota-footer 模型标签

role:
  # 20% 需求 (436/2106)。代码 agent (claude/codex/glm/deepseek/gemini) 角色推定。
  evidence: "role_inference (非实测, 代码 agent 通用方法论)"
  builder:
    - python
    - testing
    - debug.systematic
    - test.tdd
    - repair.pr-cot
    - failure.structured_repair
    - workflow.planning
    - skill.methodology
    - code.implementation
    - code_impl          # 同 code.implementation (历史拼写)
    - documentation      # 代码 agent 通用产出能力
    - agents_sdk.design       # 公开框架知识
    - agents_sdk.guardrails
    - agents_sdk.tracing
    - agents_sdk.handoff_model
  planner:
    - agents_sdk.design       # 公开框架知识 (OpenAI Agents SDK)
    - agents_sdk.guardrails
    - agents_sdk.tracing
    - agents_sdk.handoff_model
    - workflow.planning
    - skill.methodology
    - analysis.causal_inference
    - architecture.design
  evaluator:
    - evaluation
    - code.review
    - observability
    - test.verification
  knowledge-extractor:
    - research.literature_review
    - research.empirical_pipeline
    - knowledge.extraction

operator:
  # 特化能力 per-operator 登记。evidence 逐步用真实任务/certification 补。
  mini-chatgpt-deep-research:
    evidence: "历史真实任务 (browser_agent_chatgpt_wrapper 产出)"
    capabilities:
      - browser.browse
      - browser.automation
      - research.deep_research
  op.browser.webwright.playwright.01:
    evidence: "registry 声明 (待实测)"
    capabilities:
      - browser.qa
      - browser.screenshot
      - browser.localhost_test
      - browser.automation
  op.browser.browser_use_mcp.quick.01:
    evidence: "registry 声明 (待实测)"
    capabilities:
      - browser.mcp
      - browser.browse

aliases:
  # 受控别名 (需求词 → 词表词), 只许收敛不许发明
  workflow.plan: workflow.planning
  tdd: test.tdd
  systematic-debugging: debug.systematic

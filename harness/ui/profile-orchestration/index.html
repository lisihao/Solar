<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Orchestration — S04 GEPA Self-Optimizing Compiler</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div>
    <div class="breadcrumb">
      <a href="../orchestration/">DAG Dashboard</a> / Profile Orchestration
    </div>
    <h1>Profile Orchestration &amp; GEPA Optimization Status</h1>
  </div>
  <span id="last-refresh" style="margin-left:auto;font-size:11px;color:#6e7681;"></span>
</header>

<div class="tab-bar">
  <button class="tab-btn active" data-tab="registry">Registry</button>
  <button class="tab-btn" data-tab="pareto">Pareto</button>
  <button class="tab-btn" data-tab="governance">Governance</button>
  <button class="tab-btn" data-tab="capability">Capability</button>
  <button class="tab-btn" data-tab="blocked">Blocked</button>
</div>

<div class="main">

  <!-- Registry Tab -->
  <div id="panel-registry" class="panel active">
    <button class="refresh-btn" onclick="loadTab('registry')">↺ Refresh</button>
    <h2 style="font-size:14px;margin-bottom:10px;">Compiler Profile Registry</h2>
    <div id="registry-banner" class="banner" style="display:none;"></div>
    <div id="registry-content"><div class="loading">Loading...</div></div>
    <div class="data-footer" id="registry-footer"></div>
  </div>

  <!-- Pareto Tab -->
  <div id="panel-pareto" class="panel">
    <button class="refresh-btn" onclick="loadTab('pareto')">↺ Refresh</button>
    <h2 style="font-size:14px;margin-bottom:10px;">Pareto Frontier Candidates</h2>
    <div id="pareto-banner" class="banner" style="display:none;"></div>
    <div id="pareto-content"><div class="loading">Loading...</div></div>
    <div class="data-footer" id="pareto-footer"></div>
  </div>

  <!-- Governance Tab -->
  <div id="panel-governance" class="panel">
    <button class="refresh-btn" onclick="loadTab('governance')">↺ Refresh</button>
    <h2 style="font-size:14px;margin-bottom:10px;">Profile Governance Events</h2>
    <div id="governance-banner" class="banner" style="display:none;"></div>
    <div id="governance-content"><div class="loading">Loading...</div></div>
    <div class="data-footer" id="governance-footer"></div>
  </div>

  <!-- Capability Tab -->
  <div id="panel-capability" class="panel">
    <button class="refresh-btn" onclick="loadTab('capability')">↺ Refresh</button>
    <h2 style="font-size:14px;margin-bottom:10px;">Capability Usage</h2>
    <div id="capability-banner" class="banner" style="display:none;"></div>
    <div id="capability-content"><div class="loading">Loading...</div></div>
    <div class="data-footer" id="capability-footer"></div>
  </div>

  <!-- Blocked Tab -->
  <div id="panel-blocked" class="panel">
    <button class="refresh-btn" onclick="loadTab('blocked')">↺ Refresh</button>
    <h2 style="font-size:14px;margin-bottom:10px;">Blocked Sprints &amp; Nodes</h2>
    <div id="blocked-banner" class="banner" style="display:none;"></div>
    <div id="blocked-content"><div class="loading">Loading...</div></div>
    <div class="data-footer" id="blocked-footer"></div>
  </div>

</div>

<script src="main.js"></script>
</body>
</html>

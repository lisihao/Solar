{
  "schema_version": "solar.standards.rules.manual.v1",
  "rules": [
    {
      "id": "solar.enforcement.no_completion_without_verifier",
      "source": "harness/verifier/standards/rule_packs/genesispod_standards/rules.manual.yaml",
      "source_anchor": "Completion requires post-result verifier",
      "level": "MUST",
      "rule_text": "Operators, plugins, and integrations must not directly emit node.completed/sprint.completed or mark runner status completed; they must return OperatorResult to CompletionPipeline.",
      "line_start": 1,
      "line_end": 1,
      "scope": {
        "include": [
          "harness/tools/*operator*.py",
          "harness/tools/operatord.py",
          "harness/tools/multi_task_runner.py",
          "harness/lib/multi_task_runner.py",
          "harness/plugins/**/*.py",
          "harness/integrations/**/*.py"
        ],
        "exclude": [
          "harness/lib/completion_pipeline.py",
          "harness/lib/gate_controller.py",
          "harness/tests/**"
        ]
      },
      "checker": {
        "type": "completion_enforcement",
        "name": "no_completion_without_verifier"
      },
      "gate": [
        "ci",
        "pre_push"
      ],
      "autofix": {
        "available": false
      },
      "solar_status": "covered"
    }
  ]
}

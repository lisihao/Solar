schema_version: solar.plugin.genesis_verifier.v1
name: genesis-verifier
phase: 1
mode: ts_jest_sidecar
gate_mode: warn
vendor:
  name: GenesisPod
  path: harness/plugins/genesis-verifier/vendor/GenesisPod
  source_url: https://github.com/genesis-agents/GenesisPod.git
  source_commit_file: harness/plugins/genesis-verifier/vendor/SOURCE_COMMIT
solar_wrapper:
  entrypoint: harness/tools/genesis_verifier.py
  commands:
    - solar-harness verify genesis-seed
    - solar-harness verify changed
    - solar-harness verify ci
    - solar-harness verify ratchet-baseline
    - solar-harness verify explain <rule_id>
policy:
  path: harness/verifier/genesis-policy.yaml
  default_gate_mode: warn
baseline:
  path: harness/verifier/baselines/genesis-ci-baseline.json
  ratchet_command: solar-harness verify ratchet-baseline
rule_scope:
  included:
    - genesis.arch.layer_boundaries
    - genesis.vocab.purity
    - genesis.session.projector_purity
    - genesis.arch.harness_uplift_gate
    - genesis.waiver.exception_registry
    - genesis.contract.baseline_ratchet
  excluded:
    - GenesisPod multi-agent execution
    - GenesisPod mission runtime
    - GenesisPod UI discipline
    - GenesisPod tool category rules
    - GenesisPod AI app docs coverage
